name: Playwright CI Pipeline

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]


jobs:
  playwright-tests:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    env:
      CI: true
      DB_URL: jdbc:mysql://127.0.0.1:3306/employee_support_ticket_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ci_password

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_password
          MYSQL_DATABASE: employee_support_ticket_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      # 1. Download regression testing repository
      - name: Checkout Regression Repository
        uses: actions/checkout@v4

      # 2. Download actual application repository
      - name: Checkout Ticket Application
        run: git clone --depth 1 https://github.com/pinapathrunibhargava-cloud/employee-support-ticket-app.git app

      # 3. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: app/backend/pom.xml

      # 4. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      # 5. Install Playwright dependencies
      - name: Install Regression Dependencies
        run: npm ci

      # 6. Build Spring Boot backend
      - name: Build Backend
        run: mvn -B -f app/backend/pom.xml clean package -DskipTests

      # 7. Start Spring Boot backend
      - name: Start Backend
        run: |
          JAR=$(find app/backend/target -maxdepth 1 -type f -name '*.jar' ! -name '*.jar.original' | head -n 1)
          test -n "$JAR"
          nohup java -jar "$JAR" > /tmp/backend.log 2>&1 &

      # 8. Wait for backend
      - name: Wait for Backend
        run: |
          for i in {1..60}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "X-User-Id: alice.employee" \
              -H "X-User-Role: EMPLOYEE" \
              http://localhost:8080/api/tickets || true)

            if [ "$STATUS" = "200" ]; then
              echo "Backend is ready!"
              exit 0
            fi

            sleep 2
          done

          cat /tmp/backend.log
          exit 1

      # 9. Install frontend dependencies
      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: app/frontend

      # 10. Start React frontend
      - name: Start Frontend
        run: |
          nohup npm run dev -- --host 0.0.0.0 > /tmp/frontend.log 2>&1 &
        working-directory: app/frontend

      # 11. Wait for frontend
      - name: Wait for Frontend
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:5173 > /dev/null; then
              echo "Frontend is ready!"
              exit 0
            fi
            sleep 2
          done

          cat /tmp/frontend.log
          exit 1

      # 12. Install Chromium
      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      # 13. Run smoke tests on pull requests
      - name: Run Smoke Tests
        if: github.event_name == 'pull_request'
        run: npx playwright test --project=chromium --grep "@smoke" --retries=1 --fail-on-flaky-tests

      # 14. Run complete Chromium suite on push
      - name: Run Regression Tests
        if: github.event_name == 'push' || github.event_name == 'schedule'
        run: npx playwright test --project=chromium --retries=1 --fail-on-flaky-tests

      # 15. Upload HTML report
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      # 16. Upload failure artifacts, traces and Allure results
      - name: Upload Playwright Failure Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            allure-results/
          retention-days: 14
          if-no-files-found: ignore

      # 17. Display application logs if tests fail
      - name: Display Application Logs
        if: failure()
        run: |
          echo "========== BACKEND LOGS =========="
          cat /tmp/backend.log || true
          echo "========== FRONTEND LOGS =========="
          cat /tmp/frontend.log || true